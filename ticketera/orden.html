<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu orden · Sindicato Baba</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="t.css">
<script src="qrcode.min.js" defer></script>
<script src="comun.js" defer></script>
</head>
<body>
<main id="m"><p class="muted" role="status">Cargando…</p></main>
<script>
addEventListener("DOMContentLoaded", async () => {
  const m = document.getElementById("m");
  const token = new URLSearchParams(location.search).get("t");
  const ESTADO = { en_revision: "En revisión", aprobada: "Aprobada", rechazada: "Rechazada" };
  const METODO = { pago_movil_bnc: "Pago móvil BNC", pago_movil_ubii: "Pago móvil Ubii", binance: "Binance Pay", zelle: "Zelle" };
  const enlace = location.href.split("#")[0];
  const CACHE = `ticketera-orden-${token}`;
  copiarDesde(m);

  function qr(t) {
    try {
      const q = qrcode(0, "M"); q.addData(t); q.make();
      return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    } catch {
      return `<p class="error">No se pudo dibujar el QR. Muestra el código de respaldo.</p>`;
    }
  }

  function entradaUrl(t) { return new URL(`entrada.html?e=${t}`, location.href).href; }

  function pintar(o, desdeCache) {
    const qrs = (o.entradas ?? []).map((t, i) => `
      <div class="card qr">
        <p><strong>Entrada ${i + 1} de ${o.cantidad}</strong></p>
        ${qr(t)}
        <p class="muted">Código de respaldo: ${t.slice(0, 8)}</p>
        ${o.cantidad > 1 ? `<a class="btn sec" href="https://wa.me/?text=${encodeURIComponent(`Tu entrada para ${FIESTA.nombre} (${FIESTA.fecha}): ${entradaUrl(t)}`)}" target="_blank" rel="noopener">Enviar esta entrada a un amigo</a>` : ""}
      </div>`).join("");

    const waMio = `https://wa.me/${o.telefono_wa}?text=${encodeURIComponent(`Mi orden #${o.numero} de ${FIESTA.nombre}: ${enlace}`)}`;
    m.innerHTML = `
      <h1>Orden #${o.numero}</h1>
      <p><span class="estado ${o.estado}">${ESTADO[o.estado]}</span>${desdeCache ? ` <span class="muted">· copia guardada, sin conexión</span>` : ""}</p>
      <div class="fila">
        <a class="btn" href="${waMio}" target="_blank" rel="noopener">Guardar enlace en mi WhatsApp</a>
        <button type="button" class="sec" data-copiar="${esc(enlace)}">Copiar enlace</button>
      </div>
      ${o.estado === "en_revision" ? `<div class="card espera">
        <p><strong>Revisamos cada pago a mano en el banco.</strong> Suele tardar menos de una hora; de noche puede ser a la mañana siguiente.</p>
        <p>Guarda este enlace: aquí aparecerán tus entradas con QR cuando se apruebe. La página se actualiza sola.</p>
        <p class="muted">¿Pasó mucho tiempo? <a href="${waContacto(`Hola, mi orden #${o.numero} sigue en revisión.`)}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>
      </div>` : ""}
      ${o.estado === "rechazada" ? `<div class="error">
        <p><strong>No pudimos confirmar este pago.</strong>${o.rechazo_motivo ? ` Motivo: ${esc(o.rechazo_motivo)}.` : ""}</p>
        <p><a class="btn mal" href="${waContacto(`Hola, mi orden #${o.numero} de ${FIESTA.nombre} salió rechazada. ¿Qué pasó?`)}" target="_blank" rel="noopener">Resolverlo por WhatsApp</a></p>
      </div>` : ""}
      ${o.estado === "aprobada" ? `<div class="aviso"><strong>Haz captura de pantalla de tus QR ahora.</strong> En la puerta sube el brillo y muestra un QR por persona.</div>` : ""}
      ${qrs}
      <div class="card"><dl class="datos">
        <dt>Nombre</dt><dd>${esc(o.nombre)}</dd>
        <dt>Cédula</dt><dd>${esc(o.cedula)}</dd>
        <dt>Entradas</dt><dd>${o.cantidad}</dd>
        <dt>Monto</dt><dd>${o.monto_bs ? bs(o.monto_bs) : usd(o.monto_usd_cents)}</dd>
        <dt>Pago</dt><dd>${METODO[o.metodo] ?? esc(o.metodo)} · ref. ${esc(o.referencia)}</dd>
        <dt>Fecha</dt><dd>${fechaHora(o.creada_en)}</dd>
      </dl></div>
      <p class="muted">${FIESTA.nombre} · ${FIESTA.dj} · ${FIESTA.fecha} · ${FIESTA.hora} · ${FIESTA.lugar}</p>`;
  }

  async function cargar() {
    let o;
    try {
      o = await rpc("ver_orden", { p_token: token });
    } catch (e) {
      const copia = leer(CACHE);
      if (e instanceof ErrorRed && copia) { pintar(copia, true); setTimeout(cargar, 30000); return; }
      m.innerHTML = `<p class="error" role="alert">${esc(e.message)}</p>
        <p><button type="button" class="sec" onclick="location.reload()">Reintentar</button></p>`;
      return;
    }
    if (!o) {
      m.innerHTML = `<h1>Orden no encontrada</h1><p class="error" role="alert">Revisa el enlace. Si lo copiaste de WhatsApp, abre el enlace completo.</p>
        <p><a class="btn sec" href="index.html">Comprar entradas</a> <a class="btn sec" href="${waContacto("Hola, no encuentro mi orden de Sindicato Baba.")}" target="_blank" rel="noopener">Escribir por WhatsApp</a></p>`;
      return;
    }
    // El propio comprador se manda el enlace: wa.me con su número lleva a su chat "Tú".
    o.telefono_wa = (leer("ticketera-borrador")?.telefono ?? "").replace(/\D/g, "").replace(/^0/, "58");
    guardar("ticketera-orden", { token, numero: o.numero });
    if (o.estado === "aprobada") guardar(CACHE, o);
    pintar(o, false);
    if (o.estado === "en_revision") setTimeout(cargar, 30000);
  }
  cargar();
});
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu entrada · Sindicato Baba</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="t.css">
<script src="qrcode.min.js" defer></script>
<script src="comun.js" defer></script>
</head>
<body>
<main id="m"><p class="muted" role="status">Cargando…</p></main>
<script>
addEventListener("DOMContentLoaded", async () => {
  const m = document.getElementById("m");
  const token = new URLSearchParams(location.search).get("e");
  const CACHE = `ticketera-entrada-${token}`;

  function pintar(e, desdeCache) {
    let svg;
    try { const q = qrcode(0, "M"); q.addData(token); q.make(); svg = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
    catch { svg = `<p class="error">No se pudo dibujar el QR. Muestra el código de respaldo.</p>`; }
    // Boleto como el pase de cortesía, con el QR antes de los datos para que salga en la captura.
    m.innerHTML = `
      <div class="aviso"><strong>Haz captura de pantalla de este QR ahora.</strong> En la puerta sube el brillo y muéstralo.${desdeCache ? " Mostrando copia guardada, sin conexión." : ""}</div>
      <article class="boleto">
        <div class="boleto-banner">
          <img src="banner-fotocopia.jpg" srcset="banner-fotocopia.jpg 1080w, banner-fotocopia@2x.jpg 2160w" sizes="(min-width: 34rem) 34rem, 100vw" alt="DJ BABATR en letras cromadas sobre cables y fachada de Caracas en fotocopia" width="1080" height="480">
          <span class="cinta">Entrada general</span>
        </div>
        <h1>${FIESTA.nombre}</h1>
        <p class="sub">${FIESTA.dj} · Entrada ${e.posicion} de ${e.total}</p>
        <div class="corte"></div>
        <div class="qr">
          ${svg}
          <p class="muted">Código de respaldo: ${token.slice(0, 8)}</p>
          ${e.whatsapp_mascara ? `<p class="muted">Para el WhatsApp ···${esc(e.whatsapp_mascara)}</p>` : ""}
        </div>
        <div class="corte"></div>
        <dl class="boleto-datos">
          <div><dt>Fecha</dt><dd>${FIESTA.fecha}</dd></div>
          <div><dt>Hora</dt><dd>${FIESTA.hora}</dd></div>
          <div><dt>Lugar</dt><dd><a href="${FIESTA.mapa}" target="_blank" rel="noopener">${FIESTA.lugar}</a></dd></div>
          <div><dt>Orden</dt><dd>#${e.numero}</dd></div>
        </dl>
        <div class="corte"></div>
        <p class="apoyo">Con el apoyo de</p>
        <div class="patrocinio">
          <img src="logo-zulia.png" alt="Cerveza Zulia" width="47" height="62">
          <img src="logo-malportada.png" alt="Malportada" width="62" height="48">
          <img src="logo-bandera.png" alt="Bandera" width="92" height="24">
        </div>
      </article>`;
  }

  let e;
  try {
    e = await rpc("ver_entrada", { p_token: token });
  } catch (err) {
    const copia = leer(CACHE);
    if (err instanceof ErrorRed && copia) return pintar(copia, true);
    m.innerHTML = `<p class="error" role="alert">${esc(err.message)}</p><p><button type="button" class="sec" onclick="location.reload()">Reintentar</button></p>`;
    return;
  }
  if (!e) {
    m.innerHTML = `<h1>Entrada no encontrada</h1><p class="error" role="alert">Este enlace no corresponde a una entrada aprobada. Pídele a quien compró que te lo reenvíe completo.</p>`;
    return;
  }
  guardar(CACHE, e);
  pintar(e, false);
});
</script>
</body>
</html>
